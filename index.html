<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de libros</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
   <header>
    <h1>Catálogo de libros</h1>
    <p>En esta biblioteca puedes agregar tus libros leidos y los que estas por leer</p>
   </header>

   <nav></nav> 

   <main>
        <h2>Registro de libros</h2>
        <form action="" method="post" id="formulario">
            <label for="titulo">Título del libro:</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ingresa el titulo del libro">
            <br><br>
            <label for="nombre">Autor:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa el nombre del autor">
            <br><br>
            <label for="fecha">Año de publicación:</label>
            <input type="number" id="fecha" name="fecha" min="1000" max="2026" placeholder="Ingresa el año de publicación">
            <br><br>
            <label for="">Género:</label>
            <select name="genero" id="genero">
                <option value="ficcion">Ficción</option>
                <option value="cienciaf"> Ciencia Ficción</option>
                <option value="misterio">Misterio</option>
                <option value="aventura">Aventura</option>
                <option value="biografía">Biografía</option>
                <option value="hitorico">Histórico</option>
            </select>
            <br><br>
            <button type="submit">Agregar libro</button>
        </form>
   </main>

   <footer></footer> 
</body>
</html>
